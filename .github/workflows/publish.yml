name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Library (Release)
        run: dotnet build src/VzxWidgets/VzxWidgets.csproj -c Release --no-restore

      - name: Pack NuGet Package
        run: dotnet pack src/VzxWidgets/VzxWidgets.csproj -c Release -o packages --no-build

      - name: NuGet Login (OIDC Trusted Publishing)
        uses: NuGet/login@v1

      - name: Push to NuGet.org
        run: |
          $pkg = (Get-ChildItem -Path packages -Filter *.nupkg | Select-Object -First 1).FullName
          dotnet nuget push $pkg --source https://api.nuget.org/v3/index.json --skip-duplicate
